[tool.poetry]
name = "factsage-compound"
version = "0.1.0"
description = "Tools for reading and working with FactSage compound database files."
authors = ["Eugene Nekhoroshev <evgnekhoroshev@gmail.com>"]
homepage = "https://github.com/evnekdev/factsage-compound"
repository = "https://github.com/evnekdev/factsage-compound"
documentation = "https://evnekdev.github.io/factsage-compound-docs/"
keywords = [
    "factsage",
    "chemapp",
    "thermodynamics",
    "materials-science"
]
readme = "README.md"
packages = [
    { include = "factsage_compound", from = "src" }
]

[tool.poetry.dependencies]
python = ">=3.9,<4.0"
numpy = ">=1.23"
pyparsing = ">=3.1"
pandas = ">=2.0"
xlwings = ">=0.24"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pdoc = ">=14.0"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"